name: Build VPN Gate APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and OpenVPN submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - name: Install build tools and accept licenses
        run: |
          sudo apt-get update
          sudo apt-get install -y swig
          sudo chown -R $USER:$USER $ANDROID_HOME
          mkdir -p $ANDROID_HOME/licenses
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > $ANDROID_HOME/licenses/android-sdk-license
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > $ANDROID_HOME/licenses/android-sdk-preview-license
          printf "601085b94cd77f0b54ff86406957099ebe79c4d6\n" > $ANDROID_HOME/licenses/android-googletv-license
          printf "859f317696f67ef3d7f30a50a5560e7834b43903\n" > $ANDROID_HOME/licenses/android-sdk-arm-dbt-license
          printf "33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > $ANDROID_HOME/licenses/google-gdk-license
          printf "e9acab5b5fbb560a72cfaecce8946896ff6aab9d\n" > $ANDROID_HOME/licenses/mips-android-sysimage-license
          yes | sdkmanager --licenses || true
      - name: Test VPN Gate integration
        run: ./gradlew :main:testUiOvpn23DebugUnitTest --tests 'de.blinkt.openvpn.vpngate.*' --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4096m'
      - name: Build debug APK
        run: ./gradlew :main:assembleUiOvpn23Debug --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4096m'
      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: vpngate-android-debug-apk
          path: main/build/outputs/apk/uiOvpn23/debug/*universal*.apk
          if-no-files-found: error
          retention-days: 14
